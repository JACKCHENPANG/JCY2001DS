[platformio]
default_envs = SH051_1024X600_CACHE64_30M

[env:JC8048W550_VENDOR8]
platform = espressif32
framework = arduino
board = JC8048W550
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
# This board's USB-UART path has produced corrupted app images at 460800.
# Keep field uploads at the verified 115200 baud rate.
upload_speed = 115200
monitor_filters = esp32_exception_decoder

# RGB DMA must keep servicing the internal bounce buffers while OTA Flash
# writes temporarily disable the ordinary Flash cache path. pioarduino rebuilds
# the affected ESP-IDF components from these sdkconfig values.
custom_sdkconfig =
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
    CONFIG_GDMA_ISR_IRAM_SAFE=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
    CONFIG_SPIRAM_RODATA=y

build_flags =
    -Wall
    -I include
    -D LV_CONF_INCLUDE_SIMPLE
    -D BOARD_HAS_PSRAM

# Keep the standard JCY2001D build self-contained. Recent HY200C assets also
# include <lvgl.h>; relying only on the vendor demo folder leaves that header
# undiscoverable in a clean environment.
lib_deps =
    symlink://./lib-idf55/Arduino_GFX
    symlink://./lib-idf55/lvgl
    symlink://./lib-idf55/Gt911-arduino-main

lib_extra_dirs =
    /Users/jcy/Downloads/JC8048W550/1-Demo/Demo_Arduino/Libraries
    ${PROJECT_DIR}/lib-idf55

lib_ignore =
    Touch_GT911
    TFT_eSPI
    ESP32-audioI2S-master
    blinker-library-master
    Regexp-master

[env:SH051_1024X600]
extends = env:JC8048W550_VENDOR8
build_flags =
    ${env:JC8048W550_VENDOR8.build_flags}
    -D JCY_PANEL_SH051_1024X600=1

[env:B043_480X272]
extends = env:JC8048W550_VENDOR8
build_flags =
    ${env:JC8048W550_VENDOR8.build_flags}
    -D JCY_PANEL_B043_480X272=1

[env:HY200C_B043_480X272]
extends = env:JC8048W550_VENDOR8
build_flags =
    ${env:JC8048W550_VENDOR8.build_flags}
    -D JCY_PANEL_B043_480X272=1
    -D JCY_HY200C_UI=1

# Verified-on-bench combination: 64KB/64-byte-line data cache plus a 12-line
# bounce strip and 30 MHz pixel clock (vendor porch geometry).
[env:SH051_1024X600_CACHE64_30M]
extends = env:SH051_1024X600
custom_sdkconfig =
    ${env:JC8048W550_VENDOR8.custom_sdkconfig}
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
build_flags =
    ${env:SH051_1024X600.build_flags}
    -D JCY_RGB_BOUNCE_LINES=12
    -D JCY_DISPLAY_MEM_BENCH=1
