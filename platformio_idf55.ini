[platformio]
default_envs = JC8048W550_IDF55
build_dir = .pio-idf55/build
libdeps_dir = .pio-idf55/libdeps
lib_dir = lib-idf55

[env:JC8048W550_IDF55]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
framework = arduino
board = JC8048W550
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

build_flags =
    -Wall
    -I include
    -D LV_CONF_INCLUDE_SIMPLE
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    symlink://./lib-idf55/Arduino_GFX
    symlink://./lib-idf55/lvgl
    symlink://./lib-idf55/Gt911-arduino-main

lib_ignore =
    Touch_GT911
    TFT_eSPI
    ESP32-audioI2S-master
    blinker-library-master
    Regexp-master
