[platformio]
default_envs = JC8048W550_V053

[env:JC8048W550_V053]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
framework = arduino
board = JC8048W550
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

build_flags =
    -Wall
    -I include
    -D LV_CONF_INCLUDE_SIMPLE
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0

lib_extra_dirs =
    /Users/jcy/Downloads/JC8048W550/1-Demo/Demo_Arduino/Libraries

lib_ignore =
    Touch_GT911
    TFT_eSPI
    ESP32-audioI2S-master
    blinker-library-master
    Regexp-master
